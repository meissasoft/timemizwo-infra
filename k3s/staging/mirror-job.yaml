# One-shot copy of the old compose staging MinIO into the cluster MinIO. NOT
# part of kustomization.yaml; delete this file (and the timemizwo-minio-old
# secret) once staging has moved. The old compose server IS the
# meissasoft-server node and its staging MinIO listens on host loopback
# 127.0.0.1:9002, so this pod runs on that node with hostNetwork.
#
#   old letstrack-screenshots -> new timemizwo-screenshots (DB stores keys only)
#   old timemizwo-downloads   -> new timemizwo-downloads
# letstrack-downloads (pre-rebrand installers) and fcproj (unrelated) stay put.
#
# Re-run: kubectl -n timemizwo-staging delete job timemizwo-minio-mirror; apply again.
apiVersion: batch/v1
kind: Job
metadata:
  name: timemizwo-minio-mirror
  namespace: timemizwo-staging
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet # still resolve *.svc.cluster.local
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["meissasoft-server"]
      imagePullSecrets:
        - name: timemizwo-ghcr-pull
      containers:
        - name: mc
          image: ghcr.io/meissasoft/timemizwo-mc@sha256:8609a720aa0f94251ef926fa82a0173daf7085c66b65445c2dd7ef23252408f2
          command:
            - /bin/sh
            - -ec
            - |
              mc alias set old http://127.0.0.1:9002 "$OLD_ACCESS_KEY" "$OLD_SECRET_KEY" >/dev/null
              mc alias set new http://timemizwo-minio.timemizwo-staging.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
              mc mirror --overwrite --preserve old/letstrack-screenshots new/timemizwo-screenshots
              mc mirror --overwrite --preserve old/timemizwo-downloads new/timemizwo-downloads
              mc du old/letstrack-screenshots new/timemizwo-screenshots old/timemizwo-downloads new/timemizwo-downloads
          env:
            - name: OLD_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: timemizwo-minio-old
                  key: access-key
            - name: OLD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: timemizwo-minio-old
                  key: secret-key
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: timemizwo-minio-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timemizwo-minio-secret
                  key: root-password
