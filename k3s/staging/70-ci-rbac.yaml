# Lets the existing deploy identity (ServiceAccount timemizwo-ci in
# timemizwo-prod, whose kubeconfig is KUBECONFIG_PROD_B64 in timemizwo-infra)
# deploy staging too: same rights as in prod, in this namespace only. One CI
# credential for both environments - both live in the same owner-only repo.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: timemizwo-ci-deployer
  namespace: timemizwo-staging
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: timemizwo-ci-deployer
  namespace: timemizwo-staging
subjects:
  - kind: ServiceAccount
    name: timemizwo-ci
    namespace: timemizwo-prod
roleRef:
  kind: Role
  name: timemizwo-ci-deployer
  apiGroup: rbac.authorization.k8s.io
