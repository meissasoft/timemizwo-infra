# Staging copy of k3s/prod/50-ingress.yaml. Caddy on the master terminates
# TLS and forwards to Traefik with the original Host header.
#   /socket.io/  -> api  (WebSocket; Traefik upgrades natively)
#   /.well-known/oauth-* -> api (MCP OAuth discovery)
#   /api/        -> api  (incl. the Stripe webhook - Traefik passes the body
#                         through untouched, so the raw-body signature works)
#   /            -> client
# No sticky sessions: one api pod. If api is scaled out, Socket.IO long-polling
# needs stickiness - add a Traefik sticky cookie on the api Service then.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timemizwo-web
  namespace: timemizwo-staging
spec:
  ingressClassName: traefik
  rules:
    - host: staging.timemizwo.com
      http: &web
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: timemizwo-api
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: timemizwo-api
                port:
                  number: 80
          # OAuth discovery for MCP clients (AI assistants) lives at the
          # host root (RFC 8414 / 9728); the api serves it outside /api.
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: timemizwo-api
                port:
                  number: 80
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: timemizwo-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: timemizwo-client
                port:
                  number: 80
    # App host (login/dashboard). Same backends: /api and /socket.io must be
    # served here too - the refresh cookie is host-only (SameSite=Strict). The
    # client's middleware decides which pages belong to which host.
    - host: staging.app.timemizwo.com
      http: *web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timemizwo-s3
  namespace: timemizwo-staging
spec:
  ingressClassName: traefik
  rules:
    - host: s3.staging.timemizwo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: timemizwo-minio
                port:
                  number: 9000
