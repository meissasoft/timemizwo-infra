# Next.js client (standalone server). Stateless. NEXT_PUBLIC_* values are
# baked in at BUILD time by the client repo's workflow (staging branch ->
# https://staging.timemizwo.com, image tag staging-<sha>), so never point this
# at a production client image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timemizwo-client
  namespace: timemizwo-staging
  labels:
    app: timemizwo-client
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: timemizwo-client
  template:
    metadata:
      labels:
        app: timemizwo-client
    spec:
      imagePullSecrets:
        - name: timemizwo-ghcr-pull
      # Prefer devserver, then the other on-prem node (meissasoft-server, which
      # also runs ~100 docker containers and is often CPU-bound), then anywhere.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["on-prem"]
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["devserver"]
      containers:
        - name: client
          image: ghcr.io/meissasoft/timemizwo-client:REPLACE_WITH_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: timemizwo-client
  namespace: timemizwo-staging
spec:
  selector:
    app: timemizwo-client
  ports:
    - name: http
      port: 80
      targetPort: 3000
