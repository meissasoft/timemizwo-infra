# One-shot copy of the old server's MinIO into the cluster MinIO. NOT part of
# kustomization.yaml. The old compose server IS the meissasoft-server node, and
# its MinIO listens on host loopback 127.0.0.1:9004 - so this pod runs on that
# node with hostNetwork and reads it directly. (Going via s3.timemizwo.com
# through the old Apache cut large objects mid-stream.) Independent of DNS:
# run as a rehearsal now, and again during cutover after the old app stops.
# Both MinIOs use the same root keys (make-secrets.ps1 copies them).
# Re-run: kubectl -n timemizwo-prod delete job timemizwo-minio-mirror; apply again.
apiVersion: batch/v1
kind: Job
metadata:
  name: timemizwo-minio-mirror
  namespace: timemizwo-prod
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet # still resolve *.svc.cluster.local
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["meissasoft-server"]
      imagePullSecrets:
        - name: timemizwo-ghcr-pull
      containers:
        - name: mc
          image: ghcr.io/ubaid-meissasoft/timemizwo-mc@sha256:8609a720aa0f94251ef926fa82a0173daf7085c66b65445c2dd7ef23252408f2
          command:
            - /bin/sh
            - -ec
            - |
              mc alias set old http://127.0.0.1:9004 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc alias set new http://timemizwo-minio.timemizwo-prod.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              for b in timemizwo-downloads letstrack-screenshots; do
                mc mirror --overwrite --preserve old/$b new/$b
              done
              mc du new/timemizwo-downloads new/letstrack-screenshots
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: timemizwo-minio-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timemizwo-minio-secret
                  key: root-password
