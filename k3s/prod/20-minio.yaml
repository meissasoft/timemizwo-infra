# MinIO (S3) for screenshots + the desktop agent's installers/auto-update feed.
# Pinned to meissasoft-server: it has the disk (~800 GB free) that screenshots
# will need; db-cloud only has ~48 GB shared with every app's database.
#
# Public as s3.timemizwo.com (Caddy -> Traefik -> here). Presigned URLs are
# SigV4-signed over the Host header, so every hop must keep Host unchanged.
#
# Images are copies (docker save from the old server) of exactly what it ran,
# RELEASE.2025-09-07T16-13-09Z, mirrored to our GHCR: MinIO no longer
# publishes images on Docker Hub. Pinned by digest.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timemizwo-minio
  namespace: timemizwo-prod
spec:
  serviceName: timemizwo-minio
  replicas: 1
  selector:
    matchLabels:
      app: timemizwo-minio
  template:
    metadata:
      labels:
        app: timemizwo-minio
    spec:
      imagePullSecrets:
        - name: timemizwo-ghcr-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["meissasoft-server"]
      containers:
        - name: minio
          image: ghcr.io/meissasoft/timemizwo-minio:RELEASE.2025-09-07T16-13-09Z@sha256:a16cad481969d7ddb6fcd2f1c58284af3d1266190b9bedc3ef0801aeb05a93a9
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: timemizwo-minio-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timemizwo-minio-secret
                  key: root-password
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: timemizwo-minio
  namespace: timemizwo-prod
spec:
  selector:
    app: timemizwo-minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
# One-shot, idempotent: buckets + the public-read policy on downloads/agent/
# (installed agents fetch updates from there anonymously). Same as the old
# compose `minio-setup` service. Re-run: delete the Job and apply again.
apiVersion: batch/v1
kind: Job
metadata:
  name: timemizwo-minio-setup
  namespace: timemizwo-prod
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: timemizwo-ghcr-pull
      containers:
        - name: mc
          image: ghcr.io/meissasoft/timemizwo-mc@sha256:8609a720aa0f94251ef926fa82a0173daf7085c66b65445c2dd7ef23252408f2
          command:
            - /bin/sh
            - -ec
            - |
              mc alias set local http://timemizwo-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/letstrack-screenshots
              mc mb --ignore-existing local/timemizwo-downloads
              mc anonymous set download local/timemizwo-downloads/agent
              mc ls local
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: timemizwo-minio-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timemizwo-minio-secret
                  key: root-password
