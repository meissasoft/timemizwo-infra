# =============================================================================
# LetsTrack — STAGING stack (office server: timenova.meissasoft.com)
#
# Fronted by the server's EXISTING Apache/Nginx, which terminates TLS and
# forwards the domain to 127.0.0.1:${PUBLIC_PORT} (our nginx). Nothing in this
# file binds 80/443 or handles certificates.
#
# Usage (from this directory):
#   docker compose --env-file .env.staging pull
#   docker compose --env-file .env.staging up -d
#   docker compose --env-file .env.staging --profile migrate run --rm migrate
#
# ENV NOTE: flat secrets live in .env.staging and reach containers via
# `env_file:`. Composite/network values (DATABASE_URL, REDIS_URL, S3_ENDPOINT)
# are built in `environment:` so ${...} actually expands — an env_file does NOT
# expand nested ${VARS}.
# =============================================================================

name: letstrack-staging

# Shared config for the three Nest instances (api-a, api-b, worker).
# Built locally on the server; `image:` is the local tag (no registry).
x-api: &api
  image: letstrack/api:${IMAGE_TAG:-latest}
  build:
    context: ../../lets-track-api
  restart: unless-stopped
  env_file:
    - .env.staging
  environment:
    NODE_ENV: production
    PORT: "3000"
    API_PREFIX: api
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    # Public S3 endpoint so agent-upload + browser-download presigned URLs are
    # reachable from outside. Falls back to the internal hostname if unset.
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_started
  networks:
    - letstrack

services:
  # ── Reverse proxy + load balancer (published on host loopback only) ────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - client
      - api-a
      - api-b
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-9001}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - letstrack

  # ── API replica A ──────────────────────────────────────────────────────────
  api-a:
    <<: *api
    stop_grace_period: 30s

  # ── API replica B ──────────────────────────────────────────────────────────
  api-b:
    <<: *api
    stop_grace_period: 30s

  # ── BullMQ worker (same image; drains in-flight jobs on SIGTERM) ───────────
  worker:
    <<: *api
    stop_grace_period: 45s

  # ── Next.js client (standalone server) ─────────────────────────────────────
  client:
    image: letstrack/client:${IMAGE_TAG:-latest}
    build:
      context: ../../lets-track-client
      args:
        # NEXT_PUBLIC_* are inlined into the browser bundle at BUILD time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_PRODUCT_NAME: ${NEXT_PUBLIC_PRODUCT_NAME:-LetsTrack}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-Meissasoft}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - letstrack

  # ── Postgres ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment to reach Postgres from the host (e.g. a DB GUI):
    # ports:
    #   - "127.0.0.1:9004:5432"
    networks:
      - letstrack

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - letstrack

  # ── MinIO (S3-compatible object store) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      # S3 API — fronted publicly by s3.timenova.meissasoft.com (Apache → here).
      - "127.0.0.1:9002:9000"
      # MinIO console UI (optional):
      # - "127.0.0.1:9003:9001"
    networks:
      - letstrack

  # ── One-shot: create buckets + policies, then exit ─────────────────────────
  # Creates the private screenshots bucket, and a downloads bucket whose
  # `agent/` prefix is anonymously readable (public GET) so the desktop agent
  # app can pull installers / auto-update files over plain HTTPS without keys.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo 'waiting for minio...'; sleep 2;
        done;
        mc mb --ignore-existing local/"$$S3_BUCKET";
        echo "bucket $$S3_BUCKET ready (private)";
        mc mb --ignore-existing local/"$$DOWNLOADS_BUCKET";
        mc anonymous set download local/"$$DOWNLOADS_BUCKET"/agent;
        echo "bucket $$DOWNLOADS_BUCKET ready (agent/ prefix = public-read)";
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      DOWNLOADS_BUCKET: ${DOWNLOADS_BUCKET:-letstrack-downloads}
    restart: "no"
    networks:
      - letstrack

  # ── One-shot: node-pg-migrate (expand-phase, additive only) ────────────────
  # Profile-gated so it never starts with `up`. Run explicitly:
  #   docker compose --env-file .env.staging --profile migrate run --rm migrate
  # Built from the lets-track-db repo (Dockerfile lives in infra, so db repo
  # stays unmodified). context = db repo; dockerfile path is relative to it.
  migrate:
    image: letstrack/db-migrate:${IMAGE_TAG:-latest}
    build:
      context: ../../lets-track-db
      dockerfile: ../lets-track-infra/staging/migrate/Dockerfile
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: "no"
    networks:
      - letstrack

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  letstrack:
    driver: bridge
