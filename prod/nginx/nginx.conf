# LetsTrack production — internal reverse proxy + load balancer.
# Plain HTTP on :80. TLS is handled by the server's Apache/Nginx, which forwards
# timemizwo.com -> 127.0.0.1:9003 -> here.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Trust the host proxy (loopback + private ranges) for the real client IP.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header    X-Forwarded-For;
  real_ip_recursive on;

  log_format main '$remote_addr $host "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time up=$upstream_addr';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 75s;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # REST API — load balanced, least-busy node first (favors the drained node
  # during rolling deploys).
  upstream api_rest {
    least_conn;
    server api-a:3000 max_fails=3 fail_timeout=15s;
    server api-b:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  # Socket.IO — STICKY by client IP so the long-polling handshake keeps hitting
  # the same node. Cross-node broadcast fan-out is handled by
  # @socket.io/redis-adapter in the app (REQUIRED when running >1 replica).
  upstream api_socket {
    ip_hash;
    server api-a:3000 max_fails=3 fail_timeout=15s;
    server api-b:3000 max_fails=3 fail_timeout=15s;
  }

  upstream client_app {
    server client:3000;
    keepalive 16;
  }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-Host  $host;

  server {
    listen 80;
    server_name _;

    # Health probe for compose + the host proxy upstream check.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Socket.IO realtime. The gateway uses namespace '/ws' which rides on the
    # DEFAULT socket.io path, so the actual URL is /socket.io/ (NOT
    # /api/agent-sync/). Needs WebSocket upgrade + stickiness.
    location /socket.io/ {
      proxy_pass http://api_socket;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout  300s;
      proxy_send_timeout  300s;
      proxy_buffering off;
    }

    # Stripe webhook — raw body MUST be preserved for signature verification.
    location = /api/billing/webhook/stripe {
      proxy_pass http://api_rest;
      proxy_request_buffering off;
      proxy_buffering off;
      client_max_body_size 1m;
      proxy_read_timeout 60s;
    }

    # REST API (+ screenshot uploads).
    location /api/ {
      proxy_pass http://api_rest;
      client_max_body_size 20m;
      proxy_connect_timeout 10s;
      proxy_read_timeout  300s;
      proxy_send_timeout  300s;
    }

    # Next.js client — everything else.
    location / {
      proxy_pass http://client_app;
      proxy_read_timeout 300s;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
